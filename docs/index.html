<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indonesia Holiday API Docs</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        background: #f7f7f8;
        color: #1f2937;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .topbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px 18px;
        background: #111827;
        color: #ffffff;
      }

      .topbar label {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }

      .topbar input {
        flex: 1;
        min-width: 180px;
        height: 36px;
        padding: 0 10px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        background: #ffffff;
        color: #111827;
        font-size: 14px;
      }

      .topbar button {
        height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: #10b981;
        color: #06281e;
        font-weight: 700;
        cursor: pointer;
      }

      .hint {
        padding: 10px 18px;
        background: #ecfeff;
        border-bottom: 1px solid #cffafe;
        color: #155e75;
        font-size: 14px;
      }

      #swagger-ui {
        max-width: 1280px;
        margin: 0 auto;
      }

      @media (max-width: 720px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <label for="server-url">API base URL</label>
      <input
        id="server-url"
        type="url"
        placeholder="https://your-render-service.onrender.com"
      />
      <button id="apply-server" type="button">Apply</button>
    </div>
    <div class="hint">
      Enter your deployed API URL, then use Swagger's Try it out buttons to send
      real requests. The API must be deployed over HTTPS and allow CORS.
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      const storageKey = "indonesia-holiday-api-server";
      const serverInput = document.getElementById("server-url");
      const applyButton = document.getElementById("apply-server");
      let baseSpec;

      function normalizeServerUrl(value) {
        return value.trim().replace(/\/+$/, "");
      }

      function render(spec) {
        SwaggerUIBundle({
          spec,
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          tryItOutEnabled: true,
          displayRequestDuration: true
        });
      }

      function withSelectedServer(spec, serverUrl) {
        const nextSpec = structuredClone(spec);
        if (serverUrl) {
          nextSpec.servers = [
            {
              url: serverUrl,
              description: "Selected API"
            },
            ...nextSpec.servers
          ];
        }
        return nextSpec;
      }

      async function init() {
        const response = await fetch("./openapi.json");
        baseSpec = await response.json();
        const savedServer = localStorage.getItem(storageKey) || "";
        serverInput.value = savedServer;
        render(withSelectedServer(baseSpec, savedServer));
      }

      applyButton.addEventListener("click", () => {
        const serverUrl = normalizeServerUrl(serverInput.value);
        if (serverUrl) {
          localStorage.setItem(storageKey, serverUrl);
        } else {
          localStorage.removeItem(storageKey);
        }
        render(withSelectedServer(baseSpec, serverUrl));
      });

      init();
    </script>
  </body>
</html>
